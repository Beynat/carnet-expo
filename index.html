<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carnets d'expo">
<meta name="mobile-web-app-capable" content="yes">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Carnets d'exposition</title>
<style>
  html,body{margin:0;padding:0;}
  :root{
    --wall:#15130f;
    --panel:#201c17;
    --panel-hi:#282219;
    --paper:#ede6d3;
    --dim:#a79c87;
    --brass:#c6a244;
    --brass-dim:#8f7433;
    --oxide:#9a4b36;
    --line:rgba(198,162,68,0.22);
    --line-strong:rgba(198,162,68,0.45);
    --serif:'Iowan Old Style','Palatino Linotype',Georgia,'Times New Roman',serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,'SF Mono','Cascadia Code','Roboto Mono',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{background:var(--wall);}
  #app{
    background:var(--wall);
    color:var(--paper);
    font-family:var(--sans);
    min-height:100vh;
    min-height:100dvh;
    padding:0;
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .shell{max-width:560px;margin:0 auto;padding:20px 18px 64px;}

  .plaque{
    display:flex;align-items:baseline;justify-content:space-between;
    padding-bottom:14px;margin-bottom:18px;
    border-bottom:1px solid var(--line-strong);
  }
  .plaque h1{
    font-family:var(--serif);font-weight:400;font-size:22px;letter-spacing:0.04em;
    margin:0;color:var(--paper);
  }
  .plaque .count{
    font-family:var(--mono);font-size:11px;letter-spacing:0.08em;color:var(--dim);
    text-transform:uppercase;
  }

  .search{
    display:flex;align-items:center;gap:8px;
    background:var(--panel);border:1px solid var(--line);border-radius:2px;
    padding:10px 12px;margin-bottom:16px;
  }
  .search input{
    background:none;border:none;outline:none;color:var(--paper);
    font-family:var(--sans);font-size:16px;width:100%;
  }
  .search input::placeholder{color:var(--dim);}
  .search svg{flex-shrink:0;opacity:0.6;}

  .card{
    position:relative;
    background:var(--panel);
    border:1px solid var(--line);
    border-left:2px solid var(--oxide);
    border-radius:2px;
    padding:14px 16px 14px 18px;
    margin-bottom:10px;
    cursor:pointer;
  }
  .card:active{background:var(--panel-hi);transform:scale(0.99);}
  .card .num{
    font-family:var(--mono);font-size:10px;letter-spacing:0.1em;color:var(--brass);
    display:block;margin-bottom:6px;text-transform:uppercase;
  }
  .card .artist{
    font-family:var(--serif);font-size:19px;color:var(--paper);margin:0 0 2px;
  }
  .card .expo{
    font-family:var(--sans);font-size:13px;color:var(--dim);font-style:italic;margin:0 0 8px;
  }
  .card .meta{
    font-family:var(--mono);font-size:10.5px;letter-spacing:0.05em;color:var(--brass-dim);
    text-transform:uppercase;
  }

  .empty{
    text-align:center;padding:56px 20px;color:var(--dim);
  }
  .empty .glyph{font-size:28px;margin-bottom:12px;opacity:0.5;}
  .empty p{font-size:14px;line-height:1.6;margin:0 0 18px;}

  .back{
    display:flex;align-items:center;gap:6px;background:none;border:none;
    color:var(--dim);font-family:var(--mono);font-size:11px;letter-spacing:0.08em;
    text-transform:uppercase;cursor:pointer;padding:6px 0;margin-bottom:16px;
  }

  .label-block{
    border:1px solid var(--line-strong);padding:16px 16px 18px;border-radius:2px;
    margin-bottom:18px;background:var(--panel);
  }
  .label-block .num{
    font-family:var(--mono);font-size:10px;letter-spacing:0.1em;color:var(--brass);
    text-transform:uppercase;display:block;margin-bottom:10px;
  }
  .label-block h2{
    font-family:var(--serif);font-weight:400;font-size:26px;line-height:1.15;
    margin:0 0 3px;color:var(--paper);
  }
  .label-block .expo-title{
    font-family:var(--sans);font-style:italic;font-size:15px;color:var(--dim);margin:0 0 14px;
  }
  .dotline{
    display:flex;align-items:baseline;gap:6px;font-size:12.5px;margin:5px 0;
  }
  .dotline .k{
    font-family:var(--mono);color:var(--brass-dim);text-transform:uppercase;letter-spacing:0.05em;
    white-space:nowrap;flex-shrink:0;
  }
  .dotline .fill{
    flex:1;border-bottom:1px dotted var(--line-strong);margin-bottom:3px;min-width:8px;
  }
  .dotline .v{color:var(--paper);text-align:right;flex-shrink:0;max-width:65%;}

  .essential{
    background:var(--panel-hi);border-left:2px solid var(--brass);
    padding:14px 16px;margin-bottom:20px;border-radius:2px;
  }
  .essential .eyebrow{
    font-family:var(--mono);font-size:10px;letter-spacing:0.1em;color:var(--brass);
    text-transform:uppercase;display:block;margin-bottom:8px;
  }
  .essential p{margin:0;font-size:14.5px;line-height:1.65;color:var(--paper);}

  details.section{
    border-bottom:1px solid var(--line);
  }
  details.section summary{
    list-style:none;cursor:pointer;padding:14px 2px;
    display:flex;align-items:center;gap:12px;
  }
  details.section summary::-webkit-details-marker{display:none;}
  details.section summary .idx{
    font-family:var(--mono);font-size:11px;color:var(--brass);flex-shrink:0;width:20px;
  }
  details.section summary .title{
    font-family:var(--serif);font-size:16.5px;color:var(--paper);flex:1;
  }
  details.section summary .chev{
    font-family:var(--mono);color:var(--dim);font-size:12px;transition:transform .15s ease;
  }
  details.section[open] summary .chev{transform:rotate(90deg);}
  .section-body{padding:0 2px 18px 32px;}
  .section-body p{font-size:14px;line-height:1.7;color:var(--paper);margin:0 0 12px;}
  .section-body p:last-child{margin-bottom:0;}
  .section-body ul{margin:0 0 12px;padding-left:18px;}
  .section-body li{font-size:14px;line-height:1.6;color:var(--paper);margin-bottom:4px;}

  .vocab-item{margin-bottom:12px;}
  .vocab-item .term{
    font-family:var(--serif);font-style:italic;color:var(--brass);font-size:14.5px;
  }
  .vocab-item .def{font-size:13.5px;color:var(--dim);line-height:1.55;margin-top:2px;}

  .source-item a{
    color:var(--paper);font-size:13.5px;text-decoration:none;border-bottom:1px dotted var(--line-strong);
  }

  .footnote{
    text-align:center;font-family:var(--mono);font-size:10px;color:var(--dim);
    margin-top:28px;letter-spacing:0.05em;
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  // Les fiches vivent dans data/fiches.json — ce fichier ne contient que l'affichage.
  // Pour ajouter ou modifier une fiche, éditer data/fiches.json uniquement.
  var DATA_URL = 'data/fiches.json';

  const app = document.getElementById('app');
  let state = { view:'list', notes: [], activeId:null, query:'', loading:true, error:null };

  function sortByVisit(a,b){
    const da = a.visitDate || '', db = b.visitDate || '';
    if(da && db){ if(da !== db) return da < db ? 1 : -1; }
    else if(da && !db){ return -1; }
    else if(!da && db){ return 1; }
    return (a.artist||'').localeCompare(b.artist||'', 'fr');
  }

  function formatDateFr(iso){
    if(!iso) return '';
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
    if(!m) return iso;
    const months = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
    return parseInt(m[3],10)+' '+months[parseInt(m[2],10)-1]+' '+m[1];
  }

  function richText(text){
    if(!text) return '';
    const blocks = String(text).split(/\n\n+/);
    return blocks.map(b=>{
      const lines = b.split('\n').filter(l=>l.trim().length);
      const isList = lines.length>0 && lines.every(l=>l.trim().startsWith('- '));
      if(isList){
        return '<ul>'+lines.map(l=>'<li>'+escapeHtml(l.trim().slice(2))+'</li>').join('')+'</ul>';
      }
      return '<p>'+escapeHtml(b.trim()).replace(/\n/g,'<br>')+'</p>';
    }).join('');
  }

  function escapeHtml(s){
    const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
  }

  function iconSearch(){
    return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>';
  }

  function renderList(){
    const q = state.query.trim().toLowerCase();
    const notes = state.notes.filter(n=>{
      if(!q) return true;
      return (n.artist||'').toLowerCase().includes(q) || (n.expoTitle||'').toLowerCase().includes(q) || (n.venue||'').toLowerCase().includes(q);
    });

    let cardsHtml = '';
    if(state.loading){
      cardsHtml = '<div class="empty"><p>Ouverture de la bibliothèque…</p></div>';
    } else if(state.error){
      cardsHtml = '<div class="empty"><div class="glyph">◇</div><p>Impossible de charger les fiches.<br>'+escapeHtml(state.error)+'</p></div>';
    } else if(notes.length === 0 && !q){
      cardsHtml = '<div class="empty"><div class="glyph">◇</div><p>Aucune fiche pour l\'instant.</p></div>';
    } else if(notes.length === 0){
      cardsHtml = '<div class="empty"><p>Aucune fiche ne correspond à « '+escapeHtml(state.query)+' ».</p></div>';
    } else {
      cardsHtml = notes.map((n,i)=>{
        const num = String(i+1).padStart(3,'0');
        return '<div class="card" data-open="'+escapeHtml(n.id)+'">'
          +'<span class="num">N° '+num+'</span>'
          +'<p class="artist">'+escapeHtml(n.artist)+'</p>'
          +'<p class="expo">'+escapeHtml(n.expoTitle||'')+'</p>'
          +'<span class="meta">'+escapeHtml(n.venue||'')+(n.expoDates ? ' · '+escapeHtml(n.expoDates) : '')+(n.visitDate ? ' · Visite : '+escapeHtml(formatDateFr(n.visitDate)) : '')+'</span>'
          +'</div>';
      }).join('');
    }

    const count = state.notes.length;
    return '<div class="shell">'
      +'<div class="plaque"><h1>Carnets d\'exposition</h1><span class="count">'+count+' fiche'+(count>1?'s':'')+'</span></div>'
      +'<div class="search">'+iconSearch()+'<input id="search-input" type="text" placeholder="Chercher un artiste, une exposition…" value="'+escapeHtml(state.query)+'"></div>'
      +cardsHtml
      +'<div class="footnote">Bibliothèque publiée depuis GitHub Pages</div>'
      +'</div>';
  }

  function renderDetail(){
    const n = state.notes.find(x=>x.id===state.activeId);
    if(!n) return renderList();

    const sections = [
      {title:'Biographie synthétique', body:n.biography},
      {title:"Spécificités de l'œuvre", body:n.artwork},
      {title:'Critiques, polémiques, hauts faits', body:n.reception},
      {title:"Focus sur l'exposition", body:n.focus}
    ];

    let sectionsHtml = sections.map((s,i)=>{
      return '<details class="section"><summary><span class="idx">'+String(i+2).padStart(2,'0')+'</span><span class="title">'+escapeHtml(s.title)+'</span><span class="chev">›</span></summary>'
        +'<div class="section-body">'+richText(s.body)+'</div></details>';
    }).join('');

    if(n.vocabulary && n.vocabulary.length){
      const vocabHtml = n.vocabulary.map(v=>'<div class="vocab-item"><span class="term">'+escapeHtml(v.term)+'</span><div class="def">'+escapeHtml(v.def)+'</div></div>').join('');
      sectionsHtml += '<details class="section"><summary><span class="idx">06</span><span class="title">Repères de vocabulaire</span><span class="chev">›</span></summary><div class="section-body">'+vocabHtml+'</div></details>';
    }
    if(n.sources && n.sources.length){
      const srcHtml = n.sources.map(s=>'<div class="source-item">'+(s.url ? '<a href="'+escapeHtml(s.url)+'" target="_blank" rel="noopener">'+escapeHtml(s.label)+'</a>' : escapeHtml(s.label))+'</div>').join('');
      sectionsHtml += '<details class="section"><summary><span class="idx">07</span><span class="title">Sources</span><span class="chev">›</span></summary><div class="section-body">'+srcHtml+'</div></details>';
    }

    return '<div class="shell">'
      +'<button class="back" data-nav="list">‹ Bibliothèque</button>'
      +'<div class="label-block">'
        +'<span class="num">Fiche d\'exposition</span>'
        +'<h2>'+escapeHtml(n.artist)+'</h2>'
        +'<p class="expo-title">'+escapeHtml(n.expoTitle||'')+'</p>'
        +'<div class="dotline"><span class="k">Lieu</span><span class="fill"></span><span class="v">'+escapeHtml(n.venue||'—')+'</span></div>'
        +'<div class="dotline"><span class="k">Dates expo</span><span class="fill"></span><span class="v">'+escapeHtml(n.expoDates||'—')+'</span></div>'
        +'<div class="dotline"><span class="k">Visite</span><span class="fill"></span><span class="v">'+escapeHtml(n.visitDate ? formatDateFr(n.visitDate) : 'à définir')+'</span></div>'
      +'</div>'
      +'<div class="essential"><span class="eyebrow">01 — Essentiel</span><p>'+escapeHtml(n.essential||'')+'</p></div>'
      +sectionsHtml
      +'</div>';
  }

  function render(){
    app.innerHTML = state.view === 'detail' ? renderDetail() : renderList();
    bindEvents();
  }

  function bindEvents(){
    app.querySelectorAll('[data-open]').forEach(el=>{
      el.addEventListener('click', ()=>{ state.activeId = el.getAttribute('data-open'); state.view='detail'; window.scrollTo(0,0); render(); });
    });
    app.querySelectorAll('[data-nav]').forEach(el=>{
      el.addEventListener('click', ()=>{ state.view = el.getAttribute('data-nav'); window.scrollTo(0,0); render(); });
    });
    const searchInput = app.querySelector('#search-input');
    if(searchInput){
      searchInput.addEventListener('input', (e)=>{ state.query = e.target.value; render(); setTimeout(()=>{ const el = app.querySelector('#search-input'); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } },0); });
    }
  }

  function loadNotes(){
    fetch(DATA_URL + '?t=' + Date.now(), {cache:'no-store'})
      .then(function(r){
        if(!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function(data){
        state.notes = (Array.isArray(data) ? data : []).slice().sort(sortByVisit);
        state.loading = false;
        render();
      })
      .catch(function(e){
        state.error = e.message;
        state.loading = false;
        render();
      });
  }

  render();
  loadNotes();

  // Rouvrir l'app depuis l'écran d'accueil réactive une page mise en veille par iOS
  // plutôt que de la recharger : on force un rechargement réseau à chaque retour
  // au premier plan pour éviter d'afficher une copie figée.
  var __loadedAt = Date.now();
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible' && Date.now() - __loadedAt > 2000){
      location.reload();
    }
  });
  window.addEventListener('pageshow', function(e){
    if(e.persisted) location.reload();
  });
})();
</script>
</body>
</html>
