name: Publier la bibliothèque

# Se déclenche sur n'importe quelle branche : celles que pousse Claude Code
# comme les commits faits à la main sur main.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Une seule publication à la fois, sans annuler celle en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Garde-fou : un JSON invalide ferait disparaître toute la bibliothèque,
      # pas seulement la fiche concernée. On refuse de publier dans ce cas.
      - name: Vérifier que les fiches sont un JSON valide
        run: |
          python3 -m json.tool data/fiches.json > /dev/null
          echo "JSON valide — $(python3 -c "import json;print(len(json.load(open('data/fiches.json'))))") fiche(s)"

      - name: Reporter sur main si le commit vient d'une autre branche
        if: github.ref_name != 'main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git merge --no-ff "$GITHUB_SHA" -m "Publication automatique depuis ${GITHUB_REF_NAME}"
          git push origin main

      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaqueter le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Déployer
        id: deploiement
        uses: actions/deploy-pages@v4
